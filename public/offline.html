<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন মোড - Rabbit Care BD</title>
  <meta name="theme-color" content="#064e3b">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      color: #064e3b;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .btn {
      display: inline-block;
      background: #059669;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #047857;
    }
    .tips {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐰📡</div>
    <h1>আপনি বর্তমানে অফলাইনে আছেন</h1>
    <p>ইন্টারনেট সংযোগ বিচ্ছিন্ন থাকলেও আপনার আগের সংরক্ষিত খরগোশের স্বাস্থ্য হিস্ট্রি ও রেকর্ড সুরক্ষিত আছে। ইন্টারনেট সচল হলে পুনরায় পেজ রিফ্রেশ করুন।</p>
    <button class="btn" onclick="window.location.reload()">পুনরায় চেষ্টা করুন (Retry)</button>
    <div class="tips">
      <strong>জরুরি টিপস:</strong> খরগোশ ৮ ঘণ্টার বেশি খাবার বা মল বন্ধ রাখলে অবিলম্বে স্থানীয় জরুরি ভেটেরিনারি ক্লিনিকে যোগাযোগ করুন।
    </div>
  </div>
</body>
</html>
